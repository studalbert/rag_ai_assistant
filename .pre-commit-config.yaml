repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]        # автоматически чинит то, что можно починить
      - id: ruff-format       # форматирование кода (замена black)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: []
        # На старте mypy может ругаться на отсутствие типов у сторонних библиотек —
        # это нормально, в pyproject.toml уже стоит ignore_missing_imports = true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace   # убирает лишние пробелы в конце строк
      - id: end-of-file-fixer     # гарантирует перевод строки в конце файла
      - id: check-added-large-files
        args: [--maxkb=1000]      # не даст случайно закоммитить тяжёлый файл
      - id: check-merge-conflict
