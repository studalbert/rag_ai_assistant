<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI RAG Assistant{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2"></script>
</head>
<body>
    <main class="container">
        <nav>
            <ul><li><strong>AI RAG Assistant</strong></li></ul>
            <ul>
                {% if user %}
                <li>{{ user.email }}</li>
                <li><a href="/web/logout" role="button" class="secondary">Выйти</a></li>
                {% endif %}
            </ul>
        </nav>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
