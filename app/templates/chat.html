{% extends "base.html" %}
{% block content %}
<p><a href="/web/workspaces/{{ workspace.id }}">&larr; {{ workspace.name }}</a></p>
<h2>Чат: {{ workspace.name }}</h2>

<div id="messages" style="min-height: 300px; margin-bottom: 1rem;"></div>

<form id="ask-form">
    <fieldset role="group">
        <input
            type="text"
            id="question-input"
            placeholder="Задайте вопрос по документам..."
            required
            autocomplete="off"
        >
        <button type="submit" id="ask-button">Спросить</button>
    </fieldset>
</form>

<script>
(function () {
    const workspaceId = "{{ workspace.id }}";
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question-input");
    const button = document.getElementById("ask-button");
    const messages = document.getElementById("messages");
    let chatId = null;

    function addMessage(role, text) {
        const el = document.createElement("article");
        const label = role === "user" ? "Вы" : "Ассистент";
        el.innerHTML = "<strong>" + label + ":</strong> <span></span>";
        el.querySelector("span").textContent = text;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
        return el.querySelector("span");
    }

    function addSources(sources) {
        if (!sources.length) return;
        const list = document.createElement("ol");
        list.style.fontSize = "0.85em";

        sources.forEach((source) => {
            const li = document.createElement("li");

            const link = document.createElement("a");
            link.href = "/web/workspaces/" + workspaceId + "/documents/" + source.document_id + "/download";
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = source.filename;

            const meta = document.createElement("span");
            meta.textContent = " — сходство " + source.similarity.toFixed(2) + " — ";

            const toggle = document.createElement("a");
            toggle.href = "#";
            toggle.style.fontStyle = "italic";
            toggle.textContent = "показать фрагмент";

            const fragment = document.createElement("blockquote");
            fragment.textContent = source.content;
            fragment.style.display = "none";
            fragment.style.margin = "0.3em 0";

            toggle.addEventListener("click", function (event) {
                event.preventDefault();
                const isHidden = fragment.style.display === "none";
                fragment.style.display = isHidden ? "block" : "none";
                toggle.textContent = isHidden ? "скрыть фрагмент" : "показать фрагмент";
            });

            li.appendChild(link);
            li.appendChild(meta);
            li.appendChild(toggle);
            li.appendChild(fragment);
            list.appendChild(li);
        });

        messages.appendChild(list);
        messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const question = input.value.trim();
        if (!question) return;

        input.value = "";
        button.disabled = true;
        addMessage("user", question);
        const answerSpan = addMessage("assistant", "");

        try {
            const response = await fetch("/web/workspaces/" + workspaceId + "/ask/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question, chat_id: chatId }),
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                const parts = buffer.split("\n\n");
                buffer = parts.pop();

                for (const part of parts) {
                    const line = part.split("\n").find((l) => l.startsWith("data: "));
                    if (!line) continue;
                    const evt = JSON.parse(line.slice(6));

                    if (evt.type === "chat_id") {
                        chatId = evt.chat_id;
                    } else if (evt.type === "token") {
                        answerSpan.textContent += evt.content;
                        messages.scrollTop = messages.scrollHeight;
                    } else if (evt.type === "sources") {
                        addSources(evt.sources);
                    } else if (evt.type === "error") {
                        answerSpan.textContent += " [Ошибка: " + evt.message + "]";
                    }
                }
            }
        } catch (err) {
            answerSpan.textContent += " [Ошибка соединения: " + err.message + "]";
        } finally {
            button.disabled = false;
            input.focus();
        }
    });
})();
</script>
{% endblock %}
