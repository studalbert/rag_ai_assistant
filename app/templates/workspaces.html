{% extends "base.html" %}
{% block content %}
<h2>Мои базы знаний</h2>

<form
    hx-post="/web/workspaces"
    hx-target="#workspace-list"
    hx-swap="outerHTML"
    hx-on::after-request="this.reset()"
>
    <fieldset role="group">
        <input type="text" name="name" placeholder="Название новой базы знаний" required>
        <button type="submit">Создать</button>
    </fieldset>
</form>

{% include "partials/workspace_list.html" %}

<section style="margin-top: 3rem;">
    <h3>Telegram-бот</h3>
    <button hx-post="/web/telegram/link-code" hx-target="#telegram-code-box" hx-swap="innerHTML">
        Получить код для привязки
    </button>
    <div id="telegram-code-box"></div>
</section>
{% endblock %}
