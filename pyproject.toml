[project]
name = "ai-rag-assistant"
version = "0.1.0"
description = "AI-ассистент по документам на базе RAG"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # базовый набор: ошибки, неиспользуемые импорты, сортировка импортов, устаревший синтаксис, bugbear
ignore = []

[tool.mypy]
python_version = "3.11"
strict = false          # начни мягко, ужесточишь позже (strict = true), когда проект разрастётся
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
