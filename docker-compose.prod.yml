services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rag_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - api

  certbot:
    image: certbot/certbot:v3.0.1
    container_name: rag_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # контейнер одноразовый — сертификаты выпускаем скриптом setup-ssl.sh
    entrypoint: ["certbot"]
    profiles: ["certs"]

  api:
    build: .
    container_name: rag_api
    restart: unless-stopped
    env_file:
      - .env
    # без --reload в проде
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    volumes:
      - uploads_data:/code/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # порт 8000 наружу НЕ публикуем — только через nginx
    expose:
      - "8000"

  worker:
    build: .
    container_name: rag_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - uploads_data:/code/uploads
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build: .
    container_name: rag_bot
    restart: unless-stopped
    command: python -m bot.main
    env_file:
      - .env
    volumes:
      - bot_data:/code/bot_data
    depends_on:
      api:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    # в проде порт БД наружу лучше не открывать
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

volumes:
  pgdata:
  uploads_data:
  hf_cache:
  bot_data:
  certbot_www:
  certbot_certs:
